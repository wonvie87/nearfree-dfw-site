name: Accessibility barrier / 접근성 문제
description: Report a keyboard, screen-reader, contrast, zoom, motion, language or reflow barrier.
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Describe the barrier without including personal, medical, account, payment or precise-location information. For a security vulnerability, use the private reporting link instead.

        이 이슈는 공개됩니다. 개인정보·의료 정보·계정 정보·결제 정보·정확한 위치를 제외하고 문제를 설명해 주세요. 보안 취약점은 비공개 신고 경로를 이용하세요.
  - type: input
    id: page
    attributes:
      label: Page URL / 페이지 URL
      placeholder: https://wonvie87.github.io/nearfree-dfw-site/
    validations:
      required: true
  - type: dropdown
    id: barrier_type
    attributes:
      label: Barrier type / 문제 유형
      options:
        - Keyboard or focus / 키보드 또는 포커스
        - Screen reader or accessible name / 스크린 리더 또는 접근 가능한 이름
        - Contrast, color or text size / 명암·색상 또는 글자 크기
        - Zoom or narrow-screen reflow / 확대 또는 좁은 화면 재배치
        - Motion or animation / 움직임 또는 애니메이션
        - English or Korean content / 영문 또는 한국어 콘텐츠
        - Other / 기타
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What happened and what did you expect? / 발생한 문제와 기대한 동작
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and assistive technology, if useful / 필요한 경우 브라우저와 보조 기술
      description: Do not include device identifiers or other private information.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Public report confirmation / 공개 제보 확인
      options:
        - label: I did not include personal, medical, payment, account or precise-location information. / 개인정보·의료·결제·계정 정보·정확한 위치를 적지 않았습니다.
          required: true
